name: godot-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "db/seed/bank.en-ar.v1.json"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Validate Godot 4 and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project and scripts
        run: |
          godot --version
          godot --headless --editor --path godot --quit

      - name: Validate bilingual question bank
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bank = JSON.parse(fs.readFileSync('db/seed/bank.en-ar.v1.json', 'utf8'));
          const catalogs = bank.catalogs || {};
          const ids = key => new Set((catalogs[key] || []).map(item => item.id));
          const clubs = ids('clubs'), people = ids('people'), nations = ids('nations'), assets = ids('assets');
          const errors = [];
          for (const q of bank.questions || []) {
            if (!q.prompt?.en?.trim() || !q.prompt?.ar?.trim()) errors.push(q.id + ': missing bilingual prompt');
            if (!q.explainer?.en?.trim() || !q.explainer?.ar?.trim()) errors.push(q.id + ': missing bilingual explanation');
            if (!Array.isArray(q.options) || q.options.length < 2 || q.options.some(o => !o.id || !o.en?.trim() || !o.ar?.trim()) || !q.options.some(o => o.id === q.answerOptionId)) errors.push(q.id + ': incomplete options or invalid answer');
            for (const media of q.media || []) if (!assets.has(media.assetId)) errors.push(q.id + ': missing media asset ' + media.assetId);
            if (q.format === 'blur_reveal' && !(q.media || []).length) errors.push(q.id + ': image question has no media');
            if (q.format === 'emoji_story' && !q.formatData?.emoji?.trim()) errors.push(q.id + ': emoji clue is missing');
            if (q.format === 'career_path') for (const id of q.formatData?.clubIds || []) if (!clubs.has(id)) errors.push(q.id + ': unknown club ' + id);
            if (q.format === 'stat_highlow') for (const id of [q.formatData?.entityA, q.formatData?.entityB]) if (!(clubs.has(id) || people.has(id) || nations.has(id))) errors.push(q.id + ': unknown statistic entity ' + id);
          }
          if (errors.length) { console.error(errors.join('\\n')); process.exit(1); }
          console.log('Validated ' + bank.questions.length + ' complete bilingual questions.');
          NODE

      - name: Generate temporary CI debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/godot-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/godot-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot/build/godot
          godot --headless --verbose --path godot --export-debug "Android" build/godot/grid-and-glory-debug.apk
          test -s godot/build/godot/grid-and-glory-debug.apk

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: grid-and-glory-godot4-apk
          if-no-files-found: error
          path: godot/build/godot/grid-and-glory-debug.apk
          retention-days: 14
